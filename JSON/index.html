<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Yläpalkki -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"> JSON tehtävät </a>
        <!-- Hamppari -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Navi linkit -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Etusivu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tokasivu.html">Sivu 2</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="pokemon.html">Pokemon</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tokapokemon.html">Pokemon 2</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="kolmas.html">Tehtävä 3</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <div id="vastaus" class="container text-center mt-4 p-3"></div>
      <script>
        fetch("tietue.JSON")
          // Muunnetaan vastaus JSON muotoon
          .then(function (response) {
            return response.json();
          })

          //Käsitellään muunnettu (eli JSON muotoinen) vastaus ja kutsutaan funktiota kerro()ja välitetään sille json-vastaus
          .then(function (responseJson) {
            kerro(responseJson);
          })
          // Jos hakemisessa tuli jokin virhe, kirjoitetaan sivulle siitä tieto
          .catch(function (error) {
            document.getElementById("vastaus").innerHTML =
              "<p>Tietoa ei pystytä hakemaan</p>";
            console.error(error);
          });

        function kerro(obj) {
          let tiedot =
            "<h1>" +
            obj.otsikko +
            "</h1><br>" +
            obj.kuvaus +
            "<br><hr>" +
            "<p><img class= 'etusivu' src='" +
            obj.kuva +
            "'></p>" +
            "<h3>" +
            "Opintojakso" +
            "</h3>" +
            "Nimi: " +
            obj.opintojakso.nimi +
            "<br>" +
            "Tunnus: " +
            obj.opintojakso.tunnus +
            "<br>" +
            "Opintopisteet: " +
            obj.opintojakso.opintopisteet +
            "<br>";

          //For silmukka, joka luo myös linkit sivulle
          for (var i = 0; i < obj.tekniikat.length; i++) {
            tiedot += "<b>Aihe: " + obj.tekniikat[i].aihe + "</b>";

            tiedot +=
              " <a href=" +
              obj.tekniikat[i].linkki +
              ">" +
              obj.tekniikat[i].linkki +
              "</a>" +
              "<br>";
          }
          tiedot += "</p>";
          document.getElementById("vastaus").innerHTML = tiedot;
        }
      </script>
    </main>
  </body>
</html>
