    <main>
        <div id="main" class="container mt-4 p-2">
        <h1>Pokemon haku</h1>
        <p>
            <input type="text" id="pokemonName" placeholder="Enter Pokemon name">
            <button onclick="poke()">Hae</button><br>

        <div id="nimi">Kirjoita laatikkoon Pokemonin nimi</div>
        <p id="kuva2"></p>
        <div id="kaanna-nappi"></div>
        </p>
        <p>
        <div id="tiedot"></div>
        <h5>Pokemonien nimiä</h5>
        <div>Jos et muista Pokemoneja ulkoa, tässä joitakin
        <br><br>
        </div>
        <ul>
            <li>Mew</li>
            <li>Eevee</li>
            <li>Bulbasaur</li>
            <li>Charmander</li>
            <li>Squirtle</li>
        </ul>
        </p>
    </div>
        <script>
            function poke() {
            //Tallennetaan annettu Poken nimi muuttujaan pokeName, muuttetaan se samalla pieniksi kirjaimiksi
                const pokeName = document.getElementById("pokemonName").value.toLowerCase();
            //Tallennetaan myös nimi talteen muuttujaan name
                let name = document.getElementById("pokemonName").value;

            //Kutsutaan fetchiä halutun Poken tiedoilla, liitetään saau nimi URL:iin
                fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)

                    // Muunnetaan vastaus JSON-muotoon  
                    .then(function (response) {
                        return response.json();
                    })

                    //Käsitellään muunnettu (eli JSON muotoinen) vastaus 
                    // Kutsutaan funktiota kerro()ja välitetään sille json-vastaus

                    .then(function (responseJson) {
                        pokekuva(responseJson);
                    })

                    // Jos tuli jokin virhe 

                    .catch(function (error) {
                        document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
                    })

                function pokekuva(obj) {
                //Tallennetaan muuttujan linkki josta löytty Poken kuva    
                    let etuPoke = obj.sprites.front_default;
                    let takaPoke = obj.sprites.back_default;

                //Pokemonin tietoja 
                    let id = obj.id
                    let pituus = obj.height
                    let paino = obj.weight

                //Kirjoitetaan kuva, ja nimi sivulla sekä tyhyjennetään hakukenttä
                    document.getElementById("nimi").innerHTML = "<b>" + name + "</b>";
                    document.getElementById("kuva2").innerHTML = "<img id='pokeKuva' src=" + etuPoke + ">";
                    document.getElementById("tiedot").innerHTML = "<p>ID: " + id + "<p>Pituus: " + pituus + "</p><p>Paino: " + paino + "</p>"  
                    document.getElementById("kaanna-nappi").innerHTML = "<button onclick='kaanna(\"" + takaPoke +"\")'>Käännä</button>";

                    //tyhjennys
                    document.getElementById("pokemonName").value = "";
                }
        }
        function kaanna(takaPoke) {
                    document.getElementById("pokeKuva").src = takaPoke;
            }
        </script>
    </main>
