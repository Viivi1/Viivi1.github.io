<html lang="fi">
  <head>
    <meta charset="UTF-8" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Yläpalkki -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand" href="index.html"> JSON tehtävät </a>
        <!-- Hamppari -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Navi linkit -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Etusivu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="tokasivu.html">Sivu 2</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="pokemon.html">Pokemon</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tokapokemon.html">Pokemon 2</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="kolmas.html">Tehtävä 3</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <div id="vastaus" class="container mt-4 p-3"></div>
      <script>
        fetch("digitekniikat.JSON")
          // Muunnetaan vastaus JSON muotoon
          .then(function (response) {
            return response.json();
          })

          //Käsitellään muunnettu (eli JSON muotoinen) vastaus ja kutsutaan funktiota kerro()ja välitetään sille json-vastaus
          .then(function (responseJson) {
            kerro(responseJson);
          })
          // Jos hakemisessa tuli jokin virhe, kirjoitetaan sivulle siitä tieto
          .catch(function (error) {
            document.getElementById("vastaus").innerHTML =
              "<p>Tietoa ei pystytä hakemaan</p>";
            console.error(error);
          });

        function kerro(obj) {
          let tiedot =
        "<h1>" + obj.otsikko + "</h1><br>" + 
        obj.osallistujamaara + "<br>" +
          obj.nimet + "<br>" +
          obj.ajankohta + "<br>" +
          obj.kesto + "<br>" + "<p><img src='" + obj.kuva + "'></p>"
          document.getElementById("vastaus").innerHTML = tiedot;
        }
      </script>
    </main>
  </body>
</html>
